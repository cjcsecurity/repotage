name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Shell
        run: |
          bash -n bin/repotage bin/doctor.sh setup.sh pipeline/master.sh
          shellcheck -S warning bin/repotage bin/doctor.sh setup.sh pipeline/master.sh
      - name: Python
        run: python -m py_compile pipeline/*.py capture/encode.py
      - name: JavaScript
        run: for f in capture/*.mjs compose/*.mjs report/*.mjs templates/*.mjs examples/self-demo/capture/*.mjs examples/self-demo/video/build/*.mjs; do node --check "$f"; done
      - name: No absolute home paths in tracked files
        run: |
          if git grep -nIE '/(Users|home)/[a-z0-9._-]+/' -- . ':!.github/workflows/ci.yml'; then echo "absolute home path committed"; exit 1; fi

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
